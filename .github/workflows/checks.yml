name: Acceptance Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yangbobo2021/app-delivery-acceptance
          ref: 525e92f29fe5c625a37669f701897596d04edfd6
          path: .reference
          persist-credentials: false
      - name: Test contracts, fixtures and legacy coexistence
        env:
          ACCEPTANCE_REFERENCE: ${{ github.workspace }}/.reference
        run: python3 -m unittest discover -s tests -v

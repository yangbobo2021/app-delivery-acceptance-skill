name: Acceptance Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: yangbobo2021/app-delivery-acceptance
          ref: 525e92f29fe5c625a37669f701897596d04edfd6
          path: .reference
          persist-credentials: false
      - name: Install coverage for subprocess checks
        run: |
          python3 -m venv "$RUNNER_TEMP/acceptance-python"
          "$RUNNER_TEMP/acceptance-python/bin/python" -m pip install coverage==7.14.2
          npm install --prefix "$RUNNER_TEMP/acceptance-node" --ignore-scripts --no-audit --no-fund c8@10.1.3
      - name: Test contracts, fixtures and legacy coexistence
        env:
          ACCEPTANCE_REFERENCE: ${{ github.workspace }}/.reference
          ACCEPTANCE_C8: ${{ runner.temp }}/acceptance-node/node_modules/.bin/c8
        run: '"$RUNNER_TEMP/acceptance-python/bin/python" -m unittest discover -s tests -v'

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: yangbobo2021/app-delivery-acceptance
          ref: 525e92f29fe5c625a37669f701897596d04edfd6
          path: .reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.14.2
      - name: Test Windows paths, records and Python coverage
        env:
          ACCEPTANCE_REFERENCE: ${{ github.workspace }}/.reference
        run: python -m unittest discover -s tests -v
